# SPDX-License-Identifier: Hippocratic-3.0
name: Benchmark Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Generate benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      integration-outcome: ${{ steps.integration.outcome }}
      benchmark-outcome: ${{ steps.benchmark-gate.outcome }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: abatilo/actions-poetry@fd0e6716a0de25ef6ade151b8b53190b0376acfd # v3

      - name: Install dependencies
        run: poetry install

      - name: Test benchmark generator
        run: poetry run pytest tests/test_benchmark_site.py

      - name: Run integration suite
        id: integration
        continue-on-error: true
        run: |
          mkdir -p .benchmark
          poetry run pytest tests/integration --junitxml=.benchmark/integration.xml

      - name: Generate Pages artifact
        run: |
          poetry run python site/generate.py \
            --output _site \
            --junit .benchmark/integration.xml \
            --commit "${GITHUB_SHA}" \
            --ref "${GITHUB_REF_NAME}"

      - name: Check benchmark assertions
        id: benchmark-gate
        continue-on-error: true
        run: |
          poetry run python -c "import json,sys; data=json.load(open('_site/data/results.json')); sys.exit(data['summary']['fail'] > 0)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    name: Deploy Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write # Required to publish the Pages deployment.
      id-token: write # Required for Pages deployment OIDC authentication.

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  gate:
    name: Verify published results
    if: always() && needs.build.result == 'success'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check integration and benchmark outcomes
        env:
          INTEGRATION_OUTCOME: ${{ needs.build.outputs.integration-outcome }}
          BENCHMARK_OUTCOME: ${{ needs.build.outputs.benchmark-outcome }}
        run: |
          test "${INTEGRATION_OUTCOME}" = "success"
          test "${BENCHMARK_OUTCOME}" = "success"
