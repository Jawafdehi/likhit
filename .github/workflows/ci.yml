# SPDX-License-Identifier: Hippocratic-3.0

# Test + lint gate for likhit, uv-native (was Poetry). Three gates plus one
# advisory step:
#
#   uv run ruff check .           gated
#   uv run ruff format --check .  gated (this replaced `black --check`)
#   uv run pytest                 gated
#   uv run ty check               ADVISORY — `|| true`, see pyproject.toml
#
# Python stays pinned to 3.12, now through setup-uv rather than setup-python:
# `requires-python` is ">=3.12,<4.0", so without the pin CI would silently move
# to whatever newer interpreter uv prefers on the runner, which is not what this
# package's classifiers claim to support.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          python-version: "3.12"

      # --locked, not --frozen: both install straight from uv.lock without
      # re-resolving, but only --locked *verifies* the lock still matches
      # pyproject.toml. Measured: bump the version in pyproject without
      # re-locking and `uv sync --frozen` exits 0 (installing the new version
      # against a lock that records the old one), while `uv sync --locked`
      # exits 1 and says to run `uv lock`. A stale lockfile should break the
      # build, not slip through it.
      - name: Install dependencies (incl. dev group)
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      # Type check, ADVISORY: reports into the log but never fails the build
      # (`|| true`). ty is pre-1.0 and this package's dependencies are largely
      # unstubbed, so at adoption it reported 102 diagnostics of which 99 were
      # tool limitations. pyproject.toml's [tool.ty.rules] silences those
      # families, leaving 3 IN `src/`. Drop the `|| true` and make this a gate
      # once those reach 0; see the staged plan in pyproject.toml.
      #
      # The scope matters, because this step runs `ty check` with no path and so
      # prints a LARGER number than the 3 above. Measured on this commit:
      #
      #   ty check src     3     <- what the suppressions are calibrated against
      #   ty check tests   5
      #   ty check         8     <- what this step prints
      #
      # Quoting one without its scope is how a reviewer concludes a change added
      # five diagnostics that were already there. See docs/writing-tests.md.
      - name: Type check (ty, advisory — does not fail the build)
        run: uv run ty check || true

      # The Lohit table in src/likhit/extractors/lohit.py is derived from one
      # exact upstream build, and tests/test_lohit.py can re-derive it and check
      # its GSUB provenance -- but only with that font present, and those tests
      # skip without it. Skipping meant the drift guard the module advertises
      # never actually ran: a mistype applied consistently to the table, the
      # addition record and the source value passes every unconditional test.
      #
      # OFL-1.1, so redistribution in CI is fine, and snapshot.debian.org is an
      # archival URL. The sha256 is the one lohit.py declares; verifying it means
      # a substituted artifact fails loudly instead of testing the wrong font.
      # continue-on-error so a network outage degrades to today's skip rather
      # than breaking the build on something unrelated to the change under test.
      - name: Fetch the Lohit-Devanagari 2.5.3 reference font
        id: lohit
        continue-on-error: true
        run: |
          set -euo pipefail
          url=https://snapshot.debian.org/archive/debian/20130601T160308Z/pool/main/f/fonts-lohit-deva/fonts-lohit-deva_2.5.3-1_all.deb
          mkdir -p "$RUNNER_TEMP/lohit" && cd "$RUNNER_TEMP/lohit"
          curl -sSLo lohit.deb --retry 3 --retry-delay 2 "$url"
          ar x lohit.deb && tar -xf data.tar.*
          ttf=usr/share/fonts/truetype/lohit-devanagari/Lohit-Devanagari.ttf
          echo "fcc1bfc221ca7b610ce6f36301bd5ac79c81124bc2a70a90872048df27c6416f  $ttf" \
            | sha256sum -c -
          echo "ttf=$PWD/$ttf" >> "$GITHUB_OUTPUT"

      - name: Run tests
        env:
          LIKHIT_LOHIT_REFERENCE_TTF: ${{ steps.lohit.outputs.ttf }}
        run: uv run pytest
