# SPDX-License-Identifier: Hippocratic-3.0

# Tag-driven PyPI release, uv-native (was Poetry). `uv build` replaces
# `poetry build`, and what it publishes was diffed against the last
# Poetry-built 0.1.7: the wheel is identical and the sdist differs only by
# `.gitignore`. Keeping it that way depends on
# [tool.hatch.build.targets.sdist] in pyproject.toml, which pins the sdist
# contents instead of taking hatchling's everything-not-gitignored default —
# see the note there before changing it.
name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

concurrency:
  group: pypi-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # setup-uv's own cache replaces the hand-rolled actions/cache of .venv
      # keyed on poetry.lock; it keys on uv.lock and caches uv's global module
      # cache, so there is no half-populated venv to reason about and no
      # `--no-root` pre-install step.
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies (incl. dev group)
        run: uv sync --locked
      - name: Lint (ruff check)
        run: uv run ruff check .
      - name: Format check (ruff format)
        run: uv run ruff format --check .
      - name: Run tests
        run: uv run pytest -v --tb=short

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      # `uv build` builds in its own isolated environment, so the project's
      # dependencies do not need installing first — the `poetry install` that
      # preceded `poetry build` here has no uv equivalent.
      - name: Build package
        run: uv build
      - name: Validate distributions
        run: uvx twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  verify-release-version:
    name: Verify release version
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected_tag = f"v{version}"
          actual_tag = "${{ github.ref_name }}"

          if actual_tag != expected_tag:
              raise SystemExit(
                  f"Release tag {actual_tag!r} does not match pyproject version {expected_tag!r}"
              )

          print(f"Verified release tag {actual_tag} matches pyproject.toml")
          PY

  publish:
    name: Publish distributions
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - test
      - build
      - verify-release-version
    environment:
      name: pypi
      url: https://pypi.org/project/likhit/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          verbose: true
          skip-existing: true
