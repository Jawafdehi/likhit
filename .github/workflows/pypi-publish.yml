# SPDX-License-Identifier: Hippocratic-3.0

# Tag-driven PyPI release, uv-native (was Poetry). `uv build` replaces
# `poetry build`, and what it publishes was diffed against the last
# Poetry-built 0.1.7: the wheel is identical and the sdist differs only by
# `.gitignore`. Keeping it that way depends on
# [tool.hatch.build.targets.sdist] in pyproject.toml, which pins the sdist
# contents instead of taking hatchling's everything-not-gitignored default —
# see the note there before changing it.
#
# This stays the entry point for publishing — PyPI's Trusted Publisher for
# `likhit` names this file, and it cannot name a reusable workflow — so the
# upload is not factored out and shared. release.yml drives it via
# `workflow_dispatch` once it has pushed the tag; see the header there for why
# a pushed tag alone cannot trigger this.
name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  # Dispatched by release.yml with `--ref <tag>`, and available by hand to
  # re-run a release that failed partway. The ref MUST be a `v*` tag: every
  # job below is gated on that, so dispatching against a branch builds and
  # tests, then publishes nothing.
  workflow_dispatch: {}

concurrency:
  group: pypi-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # setup-uv's own cache replaces the hand-rolled actions/cache of .venv
      # keyed on poetry.lock; it keys on uv.lock and caches uv's global module
      # cache, so there is no half-populated venv to reason about and no
      # `--no-root` pre-install step.
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies (incl. dev group)
        run: uv sync --locked
      - name: Lint (ruff check)
        run: uv run ruff check .
      - name: Format check (ruff format)
        run: uv run ruff format --check .
      - name: Run tests
        run: uv run pytest -v --tb=short

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      # `uv build` builds in its own isolated environment, so the project's
      # dependencies do not need installing first — the `poetry install` that
      # preceded `poetry build` here has no uv equivalent.
      - name: Build package
        run: uv build
      - name: Validate distributions
        run: uvx twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  verify-release-version:
    name: Verify release version
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected_tag = f"v{version}"
          actual_tag = "${{ github.ref_name }}"

          if actual_tag != expected_tag:
              raise SystemExit(
                  f"Release tag {actual_tag!r} does not match pyproject version {expected_tag!r}"
              )

          print(f"Verified release tag {actual_tag} matches pyproject.toml")
          PY

  publish:
    name: Publish distributions
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - test
      - build
      - verify-release-version
    environment:
      name: pypi
      url: https://pypi.org/project/likhit/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: python-package-distributions
          path: dist/
      # Pinned at v1.14.2 or newer, NOT v1.13.0: this action runs its own
      # bundled twine inside a container, and v1.13.0's was too old to parse
      # `Metadata-Version: 2.5`, which current hatchling emits. That rejected
      # the 0.2.0 wheel outright — "'2.5' is not a valid metadata version" —
      # after tests, build and `uvx twine check` had all passed. v1.14.2
      # updates the bundled twine to v7, which accepts 2.5.
      #
      # So a local `twine check` cannot clear this step: uvx resolves a current
      # twine, the action does not. When bumping hatchling or the metadata
      # version, check this pin too.
      #
      # ⚠️ This pin MUST be the dereferenced COMMIT sha, not the sha of the
      # annotated tag object. Unlike the JS actions above, this is a Docker
      # action: it pulls ghcr.io/pypa/gh-action-pypi-publish:<sha>, and those
      # image tags exist only for commits. `gh api .../git/ref/tags/v1.14.2
      # --jq .object.sha` returns the TAG OBJECT and fails here with a bare
      # `manifest unknown` from Docker, long after checkout has accepted the
      # ref as valid. Resolve it with `git ls-remote <url> 'refs/tags/<tag>^{}'`
      # and confirm the image really exists before trusting the pin.
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          verbose: true
          skip-existing: true
