[project]
name = "likhit"
version = "0.1.8"
description = "MarkItDown plugin for Nepali PDFs and legacy DOC files, with transcript quality auditing and personal-data redaction"
authors = [
    { name = "Jawafdehi", email = "inquiry@jawafdehi.org" }
]
maintainers = [
    { name = "Jawafdehi", email = "inquiry@jawafdehi.org" },
    { name = "Ashwini Subedi", email = "ashwinii.subedi@gmail.com" },
]

readme = "README.md"
requires-python = ">=3.12,<4.0"
keywords = ["markitdown-plugin", "nepali", "devanagari", "pdf", "docx", "nepali-nlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Natural Language :: Nepali",
]
dependencies = [
    "fonttools>=4.47.0,<5.0.0",
    "npttf2utf>=0.3.7,<1.0.0",
    "pymupdf==1.27.2",
    "pyyaml>=6.0,<7.0",
    "markitdown[pdf,docx]>=0.1.0,<1.0.0",
    "pyantiword>=0.1.2,<1.0.0",
    "markitdown-ocr>=0.1.0,<0.2.0",
    "openai>=2.30.0,<3.0.0",
    "sentry-sdk>=2.0.0,<3.0.0",
]

[project.urls]
Homepage = "https://jawafdehi.org/"
Repository = "https://github.com/Jawafdehi/likhit/"
Issues = "https://github.com/Jawafdehi/likhit/issues"
Documentation = "https://github.com/Jawafdehi/likhit/#readme"

# ⚠️ These extras install NOTHING today, and that is stated rather than hidden.
#
# Both feature sets are pure-stdlib, so there is no dependency for an extra to gate. And an
# extra cannot gate CODE: every module under `src/likhit/` ships in the wheel regardless, and
# `[project.scripts]` entry points always install. So `pip install likhit[quality]` and
# `pip install likhit` currently give you exactly the same files.
#
# They are declared anyway, for two reasons that are worth the two lines:
#
#   * they NAME the separable surfaces, so `likhit[quality]` in a downstream requirements
#     file records which part of this package that project actually depends on;
#   * they reserve the name for the first real optional dependency. The obvious candidate is
#     Parquet output for the audit's per-document frame, which needs pyarrow and which the
#     corpus tooling already builds outside this package.
#
# If the goal is ever that `pip install likhit` must not CONTAIN this code, an extra is the
# wrong mechanism -- exclude the subpackages from the wheel instead.
[project.optional-dependencies]
quality = []
privacy = []

[project.entry-points."markitdown.plugin"]
likhit = "likhit._plugin"

[project.scripts]
likhit-save = "likhit.save_cli:main"
likhit-audit = "likhit.quality._cli:main"
likhit-redact = "likhit.privacy._cli:main"

[build-system]
# Bounded to a major, as `poetry-core>=2.0.0,<3.0.0` was before it. This is not
# ceremony: the sdist `include` below depends on hatchling's file-selection
# semantics, and this is a package that publishes to PyPI, so a major bump must
# be an explicit decision with the artifacts re-diffed. The floor is the version
# that built the artifacts this migration was verified against.
requires = ["hatchling>=1.31,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/likhit"]

# The sdist contents are pinned deliberately. Poetry shipped only the package,
# README, LICENSE and pyproject (64 KB); hatchling's default is "everything git
# does not ignore", which would add samples/ (7.8 MB) and tests/ (2.9 MB) to a
# published artifact. Keep this list in sync if a new top-level file belongs in
# the source release.
#
# The leading slashes matter: hatchling matches gitignore-style, so a bare
# `README.md` would also pull in `site/README.md`.
#
# Verified against the last Poetry-built 0.1.7 artifacts: both the wheel and the
# sdist carry an identical file list, except that hatchling also puts
# `.gitignore` in the sdist. That one is force-included by the backend — an
# `exclude` entry for it has no effect — and at under 5 KB it is not worth
# working around.
[tool.hatch.build.targets.sdist]
include = ["/src/likhit", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[dependency-groups]
# Dev tooling (lint/format/type/test). Not shipped in the wheel.
#
# black is gone: `ruff format` replaces it, so the whole toolchain is Astral's
# and there is one less formatter version to keep in step. The two disagree on
# 3 of this tree's 61 files (all under tests/), reformatted once in the
# migration commit; `ruff format --check .` is clean from here on.
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "pytest-xdist>=3.6.0,<4.0.0",
    "ruff>=0.15.0,<0.16.0",
    "pre-commit>=4.6.0",
    "ty>=0.0.66",
    # site/schema.json is published next to results.json as the artifact's
    # contract, so the tests validate the generated artifact against it rather
    # than only asserting the schema's own contents.
    "jsonschema>=4.23.0,<5.0.0",
]

# ---------------------------------------------------------------------------
# pytest. testpaths is pinned to tests/, which is where every test module already
# lives (tests/ and tests/integration are the only two directories holding any).
# Measured: it changes nothing today -- 737 collected in ~1.1s either way, and
# there is nothing collectible under site/ -- so treat it as a constraint on
# future collection, not as a fix for anything.
#
# `-n auto` is deliberately NOT in addopts, on measured grounds. Whole-suite
# figures on a 64-core box, every run identical at 722 passed / 10 skipped /
# 5 xfailed. The range is where the run was repeated:
#
#     serial    62.6s
#     -n 4      31.4s   (2.0x -- what a 4-vCPU CI runner sees)
#     -n 8      33.8s
#     -n 16     28.9s
#     -n auto   21.0-22.2s  (3.0x; `auto` is 64 here)
#
# Past -n 4 the gains are small and not monotonic -- -n 8 measured slower than
# -n 4 here -- so do not read the column as a scaling curve.
#
# But it is a net loss on the single-file runs that dominate local iteration:
# tests/test_convert.py alone is 6.96s serial and 7.69s under `-n auto`. `-p
# xdist` also disables `--pdb`. So parallelism is opt-in per invocation:
#
#     uv run pytest -n auto                  # whole suite, fastest
#     uv run pytest tests/test_convert.py    # iterating, no worker overhead
#
# CI passes `-n auto` explicitly on the "Run tests" step instead. Expect ~4
# workers there (ubuntu-latest is 4 vCPU), not this box's count.
#
# Do not expect linear scaling, for two reasons. The serial suite already runs
# at ~181% CPU because PyMuPDF threads internally; and the parallel floor is set
# by the longest single test, which is the 11.7s full-document kanunpatrika smoke
# in tests/integration/test_sample_pdfs.py. No worker count gets the suite below
# that.
#
# 🛑 Before widening parallelism further, look for tests that touch state shared
# across workers -- not only for order dependence. Two were found when `-n auto`
# was turned on here, and they failed in opposite ways:
#
#   * tests/test_kalimati_reference.py wrote a FIXED-name scratch font into
#     site-packages/fitz/ and unlinked it, so three tests raced and one died with
#     "cannot open ..._embedded_kalimati_test.ttf" -- 4 failures in 6 runs of
#     `pytest -n 3` on that file.
#   * tests/test_scanned_pdf_detection.py deleted npttf2utf bytecode to force a
#     fresh compile. A sibling worker's import restores it, and with the bytecode
#     present the warning never fires -- so that test went VACUOUS rather than red:
#     it passed with the thing it tests removed.
#
# The second is the dangerous shape, because a green suite is the symptom.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# External provenance and private-fixture checks are opt-in. Setting this key
# replaces pytest's defaults, so keep those exclusions alongside ``manual``.
# Passing a manual path explicitly still overrides the recursion exclusion.
norecursedirs = [
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "{arch}",
    "manual",
]

# ---------------------------------------------------------------------------
# ruff — the lint AND format gate. CI runs `uv run ruff check .` plus
# `uv run ruff format --check .`; pre-commit runs both as hooks.
#
# Formatting stays gated here, unlike in the jawafdehi-api monolith where 52k
# legacy lines keep `ruff format` advisory. This tree was already black-formatted
# and is 61 files, so the gate carries over from `black --check` intact.
#
# Beyond ruff's defaults (E4/E7/E9/F), two families are enforced tree-wide,
# measured on this tree at adoption:
#
#   BLE001 — 7 findings, every one a deliberate graceful-degradation path in the
#   document parsers (malformed PDF font tables, absent antiword/textutil). Each
#   now carries `# noqa: BLE001` plus a reason, so the count is 0 and a NEW
#   unexplained blind catch fails the gate instead of accumulating.
#
#   ANN (minus ANN401) — 20 findings: 15 in tests/ and 5 in
#   src/likhit/extractors/, both exempted below. Everything else is already
#   annotation-clean and is gated as such: all of src/likhit outside
#   extractors/, plus site/.
#
# ANN401 (a parameter or return annotated `Any`) is off everywhere, as in
# jawafdehi-api: where this tree reaches for `Any` it is holding a genuinely
# untyped foreign object — a PyMuPDF table, a fontTools `TTFont`. `Any` is the
# honest annotation there, and the rule would only push people to delete the
# annotation, which ANN001/ANN201 then flag.
# ---------------------------------------------------------------------------
[tool.ruff.lint]
extend-select = ["BLE", "ANN"]
extend-ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# ruff has no "select this rule for one path only" primitive, so ANN is selected
# globally above and switched OFF for the two paths that do not yet satisfy it.
# Deleting a line here is how a path opts IN — do that only once its
# `ruff check <path> --select ANN --ignore ANN401` count is actually 0. An
# entry that is always violated is not a gate.
#
# 4 ANN001 on fontTools `TTFont` parameters (kalimati.py) + 1 ANN202
# (legacy_maps.py `_get_mapper`).
"src/likhit/extractors/**" = ["ANN"]
# Tests stay exempt permanently: pytest does not read annotations, and ANN401
# would fight every fixture.
"tests/**" = ["ANN"]

# ---------------------------------------------------------------------------
# ty (astral-sh) — type checking, ADVISORY, not a gate.
#
# Run it:  uv run ty check
#
# ty is pre-1.0 (0.0.67 here). likhit has no Django, so none of jawafdehi-api's
# model-metaclass blind spot applies; what limits ty here is that this package's
# dependencies are largely unstubbed. Measured at adoption: 102 diagnostics, of
# which 99 are in the six demonstrated tool-limitation families silenced below,
# leaving 3.
# The rules stay off and ty stays advisory (CI runs it with `|| true`, and
# pre-commit does not run it) because a checker that reports 99 non-defects
# trains people to ignore it.
#
# The path to a real gate, in order:
#   1. the two big families are third-party stub gaps — revisit when PyMuPDF
#      ships type information, or add stubs for the handful of table attributes
#      tables.py touches and re-measure;
#   2. turn the small families on one at a time (each is 1-2 findings today);
#   3. only then drop the `|| true` in ci.yml and add the hook to
#      .pre-commit-config.yaml.
# ---------------------------------------------------------------------------
[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
# Never type-check the venv or generated output. `_site/` is the built benchmark
# site and `dist/` the built distributions; neither is source.
exclude = [".venv", "build", "dist", "_site"]

[tool.ty.rules]
# PyMuPDF ships no type information, so `page.find_tables()` and the table
# objects it returns are plain `object` to ty. That accounts for 19 of src's 21
# `unresolved-attribute` findings, all in src/likhit/extractors/tables.py
# (`.bbox`, `.rows`, `.row_count`, `.col_count`). The other 2 are ty declining to
# narrow a subscript expression: the `blocks[index - 1].text` reads in
# converters/nepali_pdf.py and renderers/markdown.py are each guarded by an
# `isinstance` on that same subscript a few lines above, which ty does not track.
unresolved-attribute = "ignore"
# Overload fan-out and `**kwargs` imprecision, not call errors: a single
# `OpenAI(...)` construction accounts for 5 diagnostics, one per candidate
# signature ty rejects, and `md.convert(src, **convert_kwargs)` with a
# `dict[str, str]` makes ty assume any keyword could be the `StreamInfo`
# parameter.
invalid-argument-type = "ignore"
# `pytest.skip("reason")` — ty reads the signature as taking 0 positional
# arguments. All 14 findings are that one call form.
too-many-positional-arguments = "ignore"
# Values decoded from JSON are `object`, so anything derived from a benchmark
# record trips these two.
not-subscriptable = "ignore"
unsupported-operator = "ignore"
# The optional-import idiom `try: import resource / except ImportError:
# resource = None`, used to keep the benchmark harness portable.
invalid-assignment = "ignore"
